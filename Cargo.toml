[package]
name = "blitztree"
version = "0.5.5"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "blitztree"
path = "src/bin/blitztree/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:serde_json"]
diagnostics = ["dep:sentry"]

[dependencies]
libc = "0.2"
rayon = "1.10"
serde_json = { version = "1.0", optional = true }

sentry = { version = "=0.49.3", optional = true, default-features = false, features = ["backtrace", "debug-images", "panic", "curl"] }

[profile.release]
debug = 1 # Retain line tables for the separately archived dSYMs.
lto = "thin"
codegen-units = 1

[[bin]]
name = "burrowbolt-worker"
path = "src/bin/burrowbolt-worker.rs"
required-features = ["cli"]
